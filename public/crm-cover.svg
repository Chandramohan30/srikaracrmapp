    <text x="70" y="670" font-family="sans-serif" font-size="13" font-weight="800" fill="#1E242B">Fee Installments</text>
    <circle cx="78" cy="696" r="7" fill="#22C55E"/>
    <rect x="94" y="691" width="110" height="10" rx="5" fill="#E2E8F0"/>
    <text x="260" y="700" text-anchor="end" font-family="sans-serif" font-size="10" font-weight="700" fill="#15803D">Paid</text>
    <circle cx="78" cy="724" r="7" fill="#22C55E"/>
    <rect x="94" y="719" width="96" height="10" rx="5" fill="#E2E8F0"/>
    <text x="260" y="728" text-anchor="end" font-family="sans-serif" font-size="10" font-weight="700" fill="#15803D">Paid</text>
    <circle cx="78" cy="752" r="7" fill="#F59E0B"/>
    <rect x="94" y="747" width="84" height="10" rx="5" fill="#E2E8F0"/>
    <text x="260" y="756" text-anchor="end" font-family="sans-serif" font-size="10" font-weight="700" fill="#B45309">Due</text>
  </g>

  <!-- floating: placement badge -->
  <g filter="url(#shadow)">
    <rect x="620" y="640" width="240" height="120" rx="18" fill="#FFFFFF"/>
    <circle cx="672" cy="700" r="30" fill="#FFFBEB" stroke="#D97706" stroke-width="3"/>
    <path d="M672 680 L678 693 L692 694 L681 703 L685 717 L672 709 L659 717 L663 703 L652 694 L666 693 Z" fill="#D97706"/>
    <text x="716" y="690" font-family="sans-serif" font-size="13" font-weight="800" fill="#1E242B">Placement Drive</text>
    <text x="716" y="710" font-family="sans-serif" font-size="10" fill="#64748B">36 offers this month</text>
    <rect x="716" y="722" width="120" height="8" rx="4" fill="#FEE2E2"/>
    <rect x="716" y="722" width="90" height="8" rx="4" fill="#B91C1C"/>
