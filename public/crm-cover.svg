      <rect x="744" y="306" width="22" height="22" rx="5" fill="#D97706"/>
      <rect x="776" y="306" width="22" height="22" rx="5"/>
      <rect x="808" y="306" width="22" height="22" rx="5"/>
      <rect x="680" y="338" width="22" height="22" rx="5"/>
      <rect x="712" y="338" width="22" height="22" rx="5" fill="#B91C1C"/>
      <rect x="744" y="338" width="22" height="22" rx="5"/>
      <rect x="776" y="338" width="22" height="22" rx="5"/>
      <rect x="808" y="338" width="22" height="22" rx="5"/>
      <rect x="680" y="370" width="22" height="22" rx="5"/>
      <rect x="712" y="370" width="22" height="22" rx="5"/>
      <rect x="744" y="370" width="22" height="22" rx="5"/>
      <rect x="776" y="370" width="22" height="22" rx="5" fill="#1E242B"/>
