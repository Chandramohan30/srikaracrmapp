<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Srikara CRM dashboard cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1216"/>
      <stop offset="0.55" stop-color="#1E242B"/>
      <stop offset="1" stop-color="#3A0D0D"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B91C1C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#B91C1C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="900" height="1000" fill="url(#bg)"/>
  <rect width="900" height="1000" fill="url(#dots)"/>
  <circle cx="760" cy="260" r="320" fill="url(#glowRed)"/>
  <circle cx="120" cy="820" r="300" fill="url(#glowGold)"/>

  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.08">
    <circle cx="450" cy="520" r="330"/>
    <circle cx="450" cy="520" r="250" stroke-dasharray="4 10"/>
    <circle cx="450" cy="520" r="410"/>
  </g>

  <g stroke="#D97706" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 7" fill="none">
    <path d="M170 410 C230 400 260 390 300 385"/>
    <path d="M740 410 C700 400 670 395 640 390"/>
    <path d="M200 690 C250 690 280 680 310 670"/>
    <path d="M720 690 C680 690 650 680 610 670"/>
  </g>
  <!-- main dashboard window -->
  <g filter="url(#shadow)">
    <rect x="200" y="300" width="500" height="420" rx="22" fill="#FFFFFF"/>
    <path d="M200 322 a22 22 0 0 1 22 -22 h456 a22 22 0 0 1 22 22 v26 h-500 z" fill="#1E242B"/>
    <circle cx="228" cy="324" r="6" fill="#EF4444"/>
    <circle cx="248" cy="324" r="6" fill="#F59E0B"/>
    <circle cx="268" cy="324" r="6" fill="#22C55E"/>
    <text x="292" y="329" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Srikara CRM · Dashboard</text>

    <rect x="216" y="364" width="96" height="340" rx="12" fill="#F8FAFC"/>
    <rect x="228" y="380" width="72" height="12" rx="6" fill="#B91C1C"/>
    <g fill="#CBD5E1">
      <rect x="228" y="404" width="58" height="9" rx="4.5"/>
      <rect x="228" y="424" width="66" height="9" rx="4.5"/>
      <rect x="228" y="444" width="52" height="9" rx="4.5"/>
      <rect x="228" y="464" width="62" height="9" rx="4.5"/>
      <rect x="228" y="484" width="48" height="9" rx="4.5"/>
      <rect x="228" y="504" width="60" height="9" rx="4.5"/>
