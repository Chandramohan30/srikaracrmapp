    <circle cx="356" cy="239" r="14" fill="#B91C1C"/>
    <path d="M350 239 L355 244 L363 234" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="380" y="235" font-family="sans-serif" font-size="11" font-weight="800" fill="#1E242B">Payment received</text>
    <text x="380" y="251" font-family="sans-serif" font-size="10" fill="#64748B">₹12,500 · UPI · just now</text>
  </g>

  <!-- sparkles -->
  <g fill="#F59E0B">
    <path d="M150 230 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z"/>
    <path d="M800 560 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z"/>
    <path d="M460 820 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" fill="#EF4444"/>
