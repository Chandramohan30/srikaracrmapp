    <text x="340" y="418" font-family="sans-serif" font-size="24" font-weight="800" fill="#1E242B">248</text>
    <rect x="450" y="364" width="112" height="70" rx="12" fill="#FFFBEB"/>
    <text x="464" y="388" font-family="sans-serif" font-size="11" fill="#64748B">Fees Collected</text>
    <text x="464" y="418" font-family="sans-serif" font-size="24" font-weight="800" fill="#1E242B">₹8.4L</text>
    <rect x="574" y="364" width="110" height="70" rx="12" fill="#F0FDF4"/>
    <text x="588" y="388" font-family="sans-serif" font-size="11" fill="#64748B">Placed</text>
    <text x="588" y="418" font-family="sans-serif" font-size="24" font-weight="800" fill="#1E242B">92%</text>

    <rect x="326" y="448" width="236" height="256" rx="12" fill="#F8FAFC"/>
    <text x="340" y="472" font-family="sans-serif" font-size="12" font-weight="700" fill="#1E242B">Monthly Admissions</text>
    <g fill="url(#bar)">
      <rect x="348" y="620" width="20" height="66" rx="5" opacity="0.55"/>
      <rect x="380" y="588" width="20" height="98" rx="5" opacity="0.65"/>
      <rect x="412" y="604" width="20" height="82" rx="5" opacity="0.75"/>
      <rect x="444" y="556" width="20" height="130" rx="5" opacity="0.85"/>
      <rect x="476" y="572" width="20" height="114" rx="5" opacity="0.92"/>
      <rect x="508" y="520" width="20" height="166" rx="5"/>
    </g>
    <path d="M350 590 L390 556 L422 570 L454 520 L486 534 L518 490 L540 490 L540 686 L350 686 Z" fill="url(#area)"/>
    <path d="M350 590 L390 556 L422 570 L454 520 L486 534 L518 490" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="518" cy="490" r="6" fill="#FFFFFF" stroke="#D97706" stroke-width="3"/>

    <rect x="574" y="448" width="110" height="256" rx="12" fill="#F8FAFC"/>
    <text x="588" y="472" font-family="sans-serif" font-size="12" font-weight="700" fill="#1E242B">Dues</text>
    <circle cx="629" cy="540" r="36" fill="none" stroke="#FEE2E2" stroke-width="14"/>
    <path d="M629 504 A36 36 0 1 1 594 549" fill="none" stroke="#B91C1C" stroke-width="14" stroke-linecap="round"/>
    <text x="629" y="545" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#1E242B">76%</text>
    <rect x="592" y="600" width="74" height="9" rx="4.5" fill="#CBD5E1"/>
    <rect x="592" y="618" width="58" height="9" rx="4.5" fill="#CBD5E1"/>
    <rect x="592" y="636" width="66" height="9" rx="4.5" fill="#FECACA"/>
    <rect x="592" y="654" width="46" height="9" rx="4.5" fill="#FDE68A"/>
